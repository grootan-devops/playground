name: Service · Release

# Fast track: promotes the candidate this service's pull request already built
# and scanned, by digest. Nothing is rebuilt.

on:
  workflow_call:
    inputs:
      name: { required: true, type: string }
      path: { required: true, type: string }
      image: { required: true, type: string }

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: read
  checks: write

jobs:
  init:
    name: Init
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@mono-repo-dev
    secrets: inherit
    with:
      project-path: ${{ inputs.path }}
      image-repository: ${{ inputs.image }}
      ignore-chart: "true"
      ignore-docker: "false"

  check:
    name: Guards
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@mono-repo-dev
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
      image-tag: ${{ needs.init.outputs.image-tag }}
      image-repository: ${{ needs.init.outputs.image-repository }}
      project-path: ${{ inputs.path }}
      check-migration: false

  trivy-cache:
    name: Warm Trivy Cache
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@mono-repo-dev
    secrets: inherit
    with:
      enable-java-db: "true"

  # Re-scanned at promotion: the candidate may have sat in the dev repository
  # for days, and new advisories land daily.
  scan:
    name: Scan
    needs: [init, trivy-cache]
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@mono-repo-dev
    secrets: inherit
    with:
      scan-type: image
      project-path: ${{ inputs.path }}
      image-repository: ${{ needs.init.outputs.image-dev-repository }}
      target-version: ${{ needs.init.outputs.candidate-image-tag }}

  image:
    name: Promote
    needs: [init, check, scan]
    uses: grootan-devops/github-ci-library/.github/workflows/docker.yml@mono-repo-dev
    secrets: inherit
    with:
      is-release: true
      project-path: ${{ inputs.path }}
      image-tag: ${{ needs.init.outputs.tag }}
      release-tag: ${{ needs.init.outputs.tag }}
      candidate-tag: ${{ needs.init.outputs.candidate-image-tag }}
      image-repository: ${{ needs.init.outputs.image-repository }}
      image-dev-repository: ${{ needs.init.outputs.image-dev-repository }}
      scan-result: ${{ needs.scan.result }}
