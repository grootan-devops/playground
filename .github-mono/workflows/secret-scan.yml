name: Scan · Git Secrets
run-name: "Secret Scan · ${{ github.ref_name }} · #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: grootan-devops/github-ci-library/.github/workflows/secret-scanning.yml@dev
    secrets: inherit
    with:
      full-history: true
