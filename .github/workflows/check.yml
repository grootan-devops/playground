name: Check · Release Prerequisites
run-name: "Check · ${{ inputs.service }} · #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to check
        required: true
        default: all
        type: choice
        options: [all, api, backend]

permissions:
  contents: read
  actions: write
  pull-requests: read
  checks: write

jobs:
  discover:
    name: Discover
    uses: grootan-devops/github-ci-library/.github/workflows/mono.yml@mono-repo-dev
    secrets: inherit
    with:
      only: ${{ inputs.service }}
      projects: >-
        [
          {"name":"api","path":"api","image":"grootantech/toolkit-api"},
          {"name":"backend","path":"backend","image":"grootantech/toolkit-backend"}
        ]

  service:
    name: "${{ matrix.name }}"
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/service-check.yml
    secrets: inherit
    with:
      path: ${{ matrix.path }}
      image: ${{ matrix.image }}
