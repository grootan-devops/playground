name: Probe

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: read
  checks: write

jobs:
  secret-presence:
    name: Secret Presence
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Report Which Secrets Are Visible
        env:
          U: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          P: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          DU: ${{ secrets.DOCKERHUB_USERNAME }}
          DT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reports presence only. No secret value is ever printed.
          for N in U P DU DT; do
            V="${!N:-}"
            if [[ -n "${V}" ]]; then
              echo "${N}: SET (${#V} chars)"
            else
              echo "${N}: empty"
            fi
          done

  version:
    name: Version
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"

  init:
    name: Initialize
    needs: version
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@feat/split-self-ci-and-guard-discovery
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.value }}
      ignore-chart: "true"
      ignore-docker: "false"

  image:
    name: Build, Push & Smoke Test
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/docker.yml@feat/split-self-ci-and-guard-discovery
    secrets: inherit
    with:
      image-tag: ${{ needs.init.outputs.image-push-tag }}
      image-repository: grootantec/toolkit
      test: true
      test-script: ci_image_test.sh

  scan:
    name: Scan Candidate Image
    needs: image
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@feat/split-self-ci-and-guard-discovery
    secrets: inherit
    with:
      scan-type: image
      image-ref: ${{ needs.image.outputs.image-ref-digest }}

  check:
    name: Release Guards
    needs: [init, image, scan]
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@feat/split-self-ci-and-guard-discovery
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
      image-tag: ${{ needs.init.outputs.image-tag }}
      image-repository: grootantec/toolkit
      check-migration: false

