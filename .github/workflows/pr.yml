name: CI · PR Verification
run-name: "CI · ${{ github.event.pull_request.number && format('PR #{0} · {1}', github.event.pull_request.number, github.head_ref) || format('{0} · {1}', inputs.service, github.ref_name) }}"

on:
  pull_request:
    branches: [main, dev, mono-repo-dev]
    paths:
      - ".github/**"
      - "api/**"
      - "backend/**"
  workflow_dispatch:
    inputs:
      service:
        description: Which service to verify
        required: true
        default: all
        type: choice
        options: [all, api, backend]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write
  pull-requests: read
  checks: write

jobs:
  # A pull request detects from changed files; a manual run takes the choice.
  discover:
    name: Discover
    uses: grootan-devops/github-ci-library/.github/workflows/mono.yml@mono-repo-dev
    secrets: inherit
    with:
      only: ${{ inputs.service }}
      projects: >-
        [
          {"name":"api","path":"api","image":"grootantech/toolkit-api"},
          {"name":"backend","path":"backend","image":"grootantech/toolkit-backend"}
        ]

  lint:
    name: Lint
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@mono-repo-dev
    secrets: inherit

  # One database serves every service's scan.
  trivy-cache:
    name: Warm Trivy Cache
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@mono-repo-dev
    secrets: inherit
    with:
      enable-java-db: "true"

  service:
    name: "${{ matrix.name }}"
    needs: [discover, trivy-cache]
    if: ${{ needs.discover.outputs.any-changed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/service-pr.yml
    secrets: inherit
    with:
      name: ${{ matrix.name }}
      path: ${{ matrix.path }}
      image: ${{ matrix.image }}
