name: CI · PR Verification
run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ci_image_test.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - "infra/**"
      - ".github/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit
    with:
      ignore-chart: "true"

  lint:
    permissions:
      contents: read
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit

  secret-scan:
    permissions:
      contents: read
    uses: grootan-devops/github-ci-library/.github/workflows/secret-scanning.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit

  trivy-cache:
    needs: init
    permissions:
      contents: read
      actions: write
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit
    with:
      enable-java-db: false

  image:
    needs: init
    permissions:
      contents: read
      packages: write
    uses: grootan-devops/github-ci-library/.github/workflows/docker.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit
    with:
      image-tag: ${{ needs.init.outputs.image-push-tag }}
      image-repository: ${{ needs.init.outputs.image-push-repository }}
      test: true

  image-scan:
    needs: [image, trivy-cache]
    permissions:
      contents: read
      checks: write
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit
    with:
      scan-type: image
      image-ref: ${{ needs.image.outputs.image-ref-digest }}

  tf-scan:
    needs: trivy-cache
    strategy:
      fail-fast: false
      matrix:
        root: [infra/network, infra/storage]
    permissions:
      contents: read
      checks: write
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit
    with:
      scan-type: config
      config-type: terraform
      project-path: ${{ matrix.root }}

  check:
    needs: init
    permissions:
      contents: read
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@fix-1.9.2-fail-closed-promotion
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
      image-tag: ${{ needs.init.outputs.image-tag }}
      image-repository: ${{ needs.init.outputs.image-repository }}
      check-migration: false
      # TESTING ONLY: the library is pinned to a branch until 1.9.2 is tagged.
      allow-unstable-library-refs: true
