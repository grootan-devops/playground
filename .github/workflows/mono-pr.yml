name: CI · Monorepo Verification
run-name: "Mono CI · ${{ github.event.pull_request.number && format('PR #{0} · {1}', github.event.pull_request.number, github.head_ref) || format('{0} · #{1}', github.ref_name, github.run_number) }}"

on:
  pull_request:
    branches: [main, dev, mono-repo-dev]
    paths:
      - ".github/**"
      - "services/**"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write
  pull-requests: read
  checks: write

jobs:
  # Returns only the projects whose files changed. Each entry carries its own
  # image repository, so the services never share a tag namespace.
  discover:
    name: Discover
    uses: grootan-devops/github-ci-library/.github/workflows/mono.yml@mono-repo-dev
    secrets: inherit
    with:
      projects: >-
        [
          {"name":"api","path":"services/api","image":"grootantech/toolkit-api"},
          {"name":"web","path":"services/web","image":"grootantech/toolkit-web"}
        ]

  lint:
    name: Lint
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@mono-repo-dev
    secrets: inherit

  trivy-cache:
    name: Warm Trivy Cache
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@mono-repo-dev
    secrets: inherit
    with:
      enable-java-db: "true"

  # One child instance per changed project. Nesting keeps each project's
  # init outputs inside its own instance.
  project:
    name: "${{ matrix.name }}"
    needs: discover
    if: ${{ needs.discover.outputs.any-changed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/mono-child.yml
    secrets: inherit
    with:
      name: ${{ matrix.name }}
      path: ${{ matrix.path }}
      image: ${{ matrix.image }}
