name: Diagnostic · Secret Visibility
run-name: "Secret Visibility · ${{ github.actor }}"

# Temporary. Dispatch-only, so it adds no run to any push or pull request.
# It reports whether a name resolves, never a value.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence:
    name: Secret Presence
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - name: Report Which Secrets And Variables Resolve
        env:
          U: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          P: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          V_REG: ${{ vars.IMAGE_REGISTRY }}
          V_REPO: ${{ vars.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          echo "secrets (length only, never the value):"
          for N in U P; do
            V="${!N:-}"
            if [[ -n "${V}" ]]; then echo "  ${N}: SET (${#V} chars)"; else echo "  ${N}: EMPTY"; fi
          done
          echo "variables (safe to print):"
          echo "  IMAGE_REGISTRY=${V_REG:-<empty>}"
          echo "  IMAGE_REPOSITORY=${V_REPO:-<empty>}"
