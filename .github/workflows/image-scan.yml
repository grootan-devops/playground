name: Scan · Published Toolkit Image
run-name: "Image Scan · ${{ inputs.target-version }} · #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      target-version:
        description: Toolkit image tag to scan
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read
  # Lets trivy-cache.yml replace the 'trivy-db' entry; GitHub caches are
  # immutable, so a stable key has to be deleted before it can be rewritten.
  actions: write
  checks: write

jobs:
  trivy-cache:
    uses: grootan-devops/github-ci-library/.github/workflows/trivy-cache.yml@dev
    secrets: inherit
    with:
      # The toolkit image ships a JDK, so Trivy needs the Java DB to scan it.
      # Warm it once here rather than downloading 900MB in the scan job.
      enable-java-db: "true"

  image-scan:
    needs: trivy-cache
    uses: grootan-devops/github-ci-library/.github/workflows/scan.yml@dev
    secrets: inherit
    with:
      scan-type: image
      image-repository: ${{ vars.IMAGE_REPOSITORY }}
      target-version: ${{ inputs.target-version }}
