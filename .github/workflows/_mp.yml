name: MonoProbe
on:
  pull_request:
    branches: [main, dev, mono-repo-dev]
permissions:
  contents: read
  actions: write
jobs:
  discover:
    uses: grootan-devops/github-ci-library/.github/workflows/mono.yml@mono-repo-dev
    secrets: inherit
    with:
      projects: >-
        [{"name":"api","path":"services/api","image":"grootantech/toolkit-api"},
         {"name":"web","path":"services/web","image":"grootantech/toolkit-web"}]

  show:
    needs: discover
    runs-on: \${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: |
          echo "any=${{ needs.discover.outputs.any-changed }}"
          echo "count=${{ needs.discover.outputs.changed-count }}"
          echo 'matrix=${{ needs.discover.outputs.matrix }}'

  project:
    needs: discover
    if: ${{ needs.discover.outputs.any-changed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_mc.yml
    with:
      name: ${{ matrix.name }}
      path: ${{ matrix.path }}
      image: ${{ matrix.image }}
