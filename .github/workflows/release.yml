name: CD · Toolkit Image Release

on:
  push:
    branches: [main]
    # A change confined to the pipeline itself is verified by the pull request
    # that introduced it. It must never cut a release on its own.
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read
  pull-requests: read
  checks: write

jobs:
  version:
    name: Version
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"

  init:
    name: Initialize
    needs: version
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@dev
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.value }}
      ignore-chart: "true"
      ignore-docker: "false"

  check:
    name: Release Guards
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@dev
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
      image-tag: ${{ needs.init.outputs.image-tag }}
      image-repository: grootantec/toolkit
      check-migration: false

  image:
    name: Promote Verified Image
    needs: [init, check]
    uses: grootan-devops/github-ci-library/.github/workflows/docker.yml@dev
    secrets: inherit
    with:
      is-release: true
      image-tag: ${{ needs.init.outputs.tag }}
      release-tag: ${{ needs.init.outputs.tag }}
      candidate-tag: ${{ needs.init.outputs.candidate-image-tag }}
      image-repository: grootantec/toolkit
      image-dev-repository: ${{ needs.init.outputs.image-dev-repository }}

  release:
    name: Publish GitHub Release
    needs: [init, image]
    uses: grootan-devops/github-ci-library/.github/workflows/release.yml@dev
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
      upstream-run-id: ${{ needs.init.outputs.upstream-run-id }}
      notify: false
